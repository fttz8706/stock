services:
  instockdbservice:
    image: mariadb:11.4
    container_name: InStockDbService
    environment:
      MARIADB_ROOT_PASSWORD: ${INSTOCK_DB_ROOT_PASSWORD:?Set a database administrator password}
      MARIADB_DATABASE: instockdb
      MARIADB_USER: instock
      MARIADB_PASSWORD: ${INSTOCK_DB_PASSWORD:?Set the application database password}
    volumes:
      - /data/mariadb/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [instock_network]

  instock:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: instock:local
    container_name: InStock
    ports:
      - "127.0.0.1:9988:9988"
    environment:
      db_host: InStockDbService
      db_user: instock
      db_password: ${INSTOCK_DB_PASSWORD:?Set the application database password}
      INSTOCK_WEB_HOST: 0.0.0.0
      INSTOCK_WEB_USER: ${INSTOCK_WEB_USER:?Set the web username}
      INSTOCK_WEB_PASSWORD: ${INSTOCK_WEB_PASSWORD:?Set the web password}
    depends_on:
      instockdbservice:
        condition: service_healthy
    networks: [instock_network]

networks:
  instock_network:
    driver: bridge
